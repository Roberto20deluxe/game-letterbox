name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: letterbox
          POSTGRES_PASSWORD: letterbox
          POSTGRES_DB: letterbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U letterbox -d letterbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://letterbox:letterbox@localhost:5432/letterbox

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -- --no-fix
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
